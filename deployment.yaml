# Mock nginx para validar o loop GitOps do ArgoCD ponta a ponta.
# Imagem publica (nginx:1.27-alpine) — nao depende do ACR nem de secrets.
# Sem namespace fixo: o objeto cai no destination.namespace da Application do Argo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-nginx
  labels:
    app: mock-nginx
    managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mock-nginx
  template:
    metadata:
      labels:
        app: mock-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
