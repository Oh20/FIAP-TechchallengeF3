# Pipeline CD GitOps - ToggleMaster (entrega via ArgoCD)
#
# O pipeline NAO faz mais deploy no cluster. Ele para no Git:
#
#   Build/Push imagem  ->  Prepare (secrets + migrations)  ->  Promote (commit da tag)
#                                                                      |
#                                                          ArgoCD detecta e sincroniza
#
# Quem aplica no AKS e o ArgoCD, reconciliando Infra/GitOps/prod/**.
# O pipeline so precisa de permissao de push no repositorio, nao mais de
# credencial do cluster para o deploy (a stage Prepare ainda usa, ver README).
#
# Pre-requisitos:
#   1. ArgoCD instalado no AKS e o App-of-Apps aplicado (Infra/GitOps/README.md).
#   2. Build Service com permissao "Contribute" no repositorio, para o push da tag.
#   3. Em Project Settings > Pipelines > Settings, "Limit job authorization scope"
#      NAO pode bloquear o acesso ao repo, senao o push falha com 403.
#   4. Variaveis secretas dos servicos (mesmas que o azure-pipelines.yml ja usa):
#      AUTH_DATABASE_URL, AUTH_MASTER_KEY, FLAG_DATABASE_URL, TARGETING_DATABASE_URL,
#      EVAL_REDIS_URL, EVAL_SERVICE_API_KEY, EVAL_SERVICE_BUS_CONN,
#      ANALYTICS_SERVICE_BUS_CONN, ANALYTICS_COSMOS_KEY
#   5. Opcional, para a stage Verify: ARGOCD_SERVER e ARGOCD_AUTH_TOKEN.

name: cd-gitops-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      # Evita loop: o proprio pipeline commita nesse diretorio.
      # O marcador ***NO_CI*** na mensagem de commit e a segunda barreira.
      - Infra/GitOps/**
      - Mocktf/**
      - '**/*.md'

pr: none

variables:
  acrRegistry: 'fiapdevopsadegj.azurecr.io'
  acrServiceConnection: 'sc-acr-togglemaster'
  aksServiceConnection: 'aks-togglemaster'
  appsNamespace: 'toggle-apps'
  gitOpsPath: 'Infra/GitOps/prod'
  imageTag: '$(Build.BuildId)'

parameters:
  - name: services
    type: object
    default:
      - auth-service
      - flag-service
      - targeting-service
      - evaluation-service
      - analytics-service

stages:
  # ==========================================================
  # 1. Build e push das imagens para o ACR.
  # ==========================================================
  - stage: Build
    displayName: 'Build & Push das imagens'
    jobs:
      - job: BuildServices
        displayName: 'Build dos microsservicos'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          matrix:
            Auth:
              serviceName: 'auth-service'
            Flag:
              serviceName: 'flag-service'
            Targeting:
              serviceName: 'targeting-service'
            Evaluation:
              serviceName: 'evaluation-service'
            Analytics:
              serviceName: 'analytics-service'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Build & Push $(serviceName)'
            inputs:
              containerRegistry: '$(acrServiceConnection)'
              repository: '$(serviceName)'
              command: 'buildAndPush'
              Dockerfile: 'app/$(serviceName)/Dockerfile'
              buildContext: 'app/$(serviceName)'
              tags: |
                $(imageTag)

  # ==========================================================
  # 2. Secrets e migrations: operacoes imperativas que nao cabem
  #    no modelo declarativo do ArgoCD e continuam no pipeline.
  # ==========================================================
  - stage: Prepare
    displayName: 'Secrets e Migrations'
    dependsOn: Build
    jobs:
      - job: PrepareCluster
        displayName: 'Aplicar secrets e rodar migrations'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: KubernetesManifest@1
            displayName: 'Secret auth-service'
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(appsNamespace)'
              secretType: generic
              secretName: auth-service-secret
              secretArguments: '--from-literal=DATABASE_URL=$(AUTH_DATABASE_URL) --from-literal=MASTER_KEY=$(AUTH_MASTER_KEY)'

          - task: KubernetesManifest@1
            displayName: 'Secret flag-service'
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(appsNamespace)'
              secretType: generic
              secretName: flag-service-secret
              secretArguments: '--from-literal=DATABASE_URL=$(FLAG_DATABASE_URL)'

          - task: KubernetesManifest@1
            displayName: 'Secret targeting-service'
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(appsNamespace)'
              secretType: generic
              secretName: targeting-service-secret
              secretArguments: '--from-literal=DATABASE_URL=$(TARGETING_DATABASE_URL)'

          - task: KubernetesManifest@1
            displayName: 'Secret evaluation-service'
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(appsNamespace)'
              secretType: generic
              secretName: evaluation-service-secret
              secretArguments: '--from-literal=REDIS_URL=$(EVAL_REDIS_URL) --from-literal=SERVICE_API_KEY=$(EVAL_SERVICE_API_KEY) --from-literal=SERVICE_BUS_CONNECTION_STRING=$(EVAL_SERVICE_BUS_CONN)'

          - task: KubernetesManifest@1
            displayName: 'Secret analytics-service'
            inputs:
              action: createSecret
              connectionType: kubernetesServiceConnection
              kubernetesServiceConnection: '$(aksServiceConnection)'
              namespace: '$(appsNamespace)'
              secretType: generic
              secretName: analytics-service-secret
              secretArguments: '--from-literal=SERVICE_BUS_CONNECTION_STRING=$(ANALYTICS_SERVICE_BUS_CONN) --from-literal=COSMOS_KEY=$(ANALYTICS_COSMOS_KEY)'

          # ConfigMaps com o init.sql de cada servico que tem banco proprio.
          # Os caminhos sao relativos a raiz do repositorio: os manifestos estao
          # em Infra/K8S_AKS/ e os SQL em app/<servico>/db/.
          - task: Kubernetes@1
            displayName: 'Limpar configmaps de init.sql'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: delete
              arguments: 'configmap auth-initsql flag-initsql targeting-initsql -n $(appsNamespace) --ignore-not-found'

          - task: Kubernetes@1
            displayName: 'ConfigMap init.sql (auth)'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: create
              arguments: 'configmap auth-initsql --from-file=init.sql=app/auth-service/db/init.sql -n $(appsNamespace)'

          - task: Kubernetes@1
            displayName: 'ConfigMap init.sql (flag)'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: create
              arguments: 'configmap flag-initsql --from-file=init.sql=app/flag-service/db/init.sql -n $(appsNamespace)'

          - task: Kubernetes@1
            displayName: 'ConfigMap init.sql (targeting)'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: create
              arguments: 'configmap targeting-initsql --from-file=init.sql=app/targeting-service/db/init.sql -n $(appsNamespace)'

          # Jobs sao imutaveis: e preciso apagar antes de reaplicar
          - task: Kubernetes@1
            displayName: 'Limpar jobs de migration'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: delete
              arguments: 'job auth-migrate flag-migrate targeting-migrate -n $(appsNamespace) --ignore-not-found'

          - task: Kubernetes@1
            displayName: 'Aplicar jobs de migration'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: apply
              arguments: >-
                -f Infra/K8S_AKS/auth-service/migration-job.yaml
                -f Infra/K8S_AKS/flag-service/migration-job.yaml
                -f Infra/K8S_AKS/targeting-service/migration-job.yaml

          - task: Kubernetes@1
            displayName: 'Aguardar migrations'
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceEndpoint: '$(aksServiceConnection)'
              command: wait
              arguments: '--for=condition=complete job/auth-migrate job/flag-migrate job/targeting-migrate -n $(appsNamespace) --timeout=180s'

  # ==========================================================
  # 3. Promote: escreve a nova tag no Git. Este commit E o deploy.
  # ==========================================================
  - stage: Promote
    displayName: 'Promover tag no Git (GitOps)'
    dependsOn: Prepare
    condition: succeeded()
    jobs:
      - deployment: PromoteJob
        displayName: 'Atualizar overlays e commitar'
        environment: 'Production-K8s' # Approval Gate opcional
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  # Necessario para o git push autenticar com o Build Service
                  persistCredentials: true
                  clean: true

                - script: |
                    set -euo pipefail
                    curl -sSLo /tmp/kustomize.tar.gz \
                      https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
                    tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin
                    kustomize version
                  displayName: 'Instalar kustomize'

                - script: |
                    set -euo pipefail

                    # O checkout do ADO deixa o repo em detached HEAD.
                    # -B recria a branch local a partir do remoto, entao a
                    # promocao sempre vai para o topo da main.
                    git fetch origin main
                    git checkout -B main origin/main

                    for svc in ${{ join(' ', parameters.services) }}; do
                      echo "Definindo tag $(imageTag) para $svc"
                      # cd em subshell para nao vazar o diretorio entre iteracoes
                      ( cd "$(gitOpsPath)/$svc" \
                        && kustomize edit set image "$(acrRegistry)/$svc=:$(imageTag)" )
                    done

                    git diff --stat
                  displayName: 'Atualizar tag nos overlays'

                - script: |
                    set -euo pipefail

                    if git diff --quiet; then
                      echo "Nenhuma mudanca de tag. Nada a promover."
                      exit 0
                    fi

                    git config user.email "azuredevops@togglemaster.local"
                    git config user.name "Azure DevOps CD"

                    git add "$(gitOpsPath)"
                    # ***NO_CI*** impede que este commit dispare o pipeline de novo
                    git commit -m "chore(cd): deploy $(imageTag) em toggle-apps ***NO_CI***"
                    git push origin HEAD:main

                    echo "Tag $(imageTag) promovida. O ArgoCD assume a partir daqui."
                  displayName: 'Commit e push da promocao'

  # ==========================================================
  # 4. Verify: aguarda o ArgoCD sincronizar e reportar Healthy.
  #    Sem isto o pipeline fica verde antes do deploy terminar.
  # ==========================================================
  - stage: Verify
    displayName: 'Aguardar sync do ArgoCD'
    dependsOn: Promote
    condition: succeeded()
    jobs:
      - job: WaitSync
        displayName: 'argocd app wait'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none

          - script: |
              set -euo pipefail
              curl -sSLo /usr/local/bin/argocd \
                https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
              chmod +x /usr/local/bin/argocd
              argocd version --client
            displayName: 'Instalar argocd CLI'

          - script: |
              set -euo pipefail

              for svc in ${{ join(' ', parameters.services) }}; do
                echo "== $svc =="
                # refresh forca o ArgoCD a reler o Git em vez de esperar o poll
                argocd app get "$svc" --refresh --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" --grpc-web >/dev/null
                argocd app wait "$svc" \
                  --server "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" --grpc-web \
                  --health --sync --timeout 300
              done
            displayName: 'Aguardar Healthy e Synced'
            env:
              ARGOCD_SERVER: $(ARGOCD_SERVER)
              ARGOCD_TOKEN: $(ARGOCD_AUTH_TOKEN)
