trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

variables:
  azureServiceConnection: 'sc-azure-togglemaster'
  workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
  tfVersion: '1.7.5'

stages:
  - stage: ValidateAndPlan
    displayName: 'Terraform Validate & Plan'
    jobs:
      - job: Plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: '$(tfVersion)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'rg-togglemaster-tfstate'
              backendAzureRmStorageAccountName: 'sttogglemastertfstate'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'togglemaster.terraform.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(workingDirectory)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-var-file="toggle.tfvars" -out=$(Pipeline.Workspace)/tfplan'

          - publish: $(Pipeline.Workspace)/tfplan
            artifact: tfplan

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: ValidateAndPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyJob
        environment: 'Production-Infra' # Configurar Approval Gate no Azure DevOps
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@0
                  inputs:
                    terraformVersion: '$(tfVersion)'

                - download: current
                  artifact: tfplan

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(workingDirectory)'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: 'rg-togglemaster-tfstate'
                    backendAzureRmStorageAccountName: 'sttogglemastertfstate'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'togglemaster.terraform.tfstate'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(workingDirectory)'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'