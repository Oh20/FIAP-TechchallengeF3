# Plataforma: ingress + HPAs. HPA separado dos Deployments de proposito -
# ele altera spec.replicas, entao analytics/evaluation ignoram esse campo (ver seus apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://Oh20Tony@dev.azure.com/Oh20Tony/FIAP%20-%20TechChallenge/_git/TCF3%20-%20K8S'
    targetRevision: main
    path: overlays/prod/platform
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: toggle-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
