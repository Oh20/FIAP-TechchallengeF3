apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://Oh20Tony@dev.azure.com/Oh20Tony/FIAP%20-%20TechChallenge/_git/TCF3%20-%20K8S'
    targetRevision: main
    path: overlays/prod/analytics-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: toggle-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # O HPA (app platform) gerencia spec.replicas deste Deployment. Sem isto o selfHeal
  # reverteria o autoscaling a cada sync e o app ficaria permanentemente OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: analytics-service
      jsonPointers:
        - /spec/replicas
