apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: toggle-apps

resources:
- ../../../K8S_AKS/auth-service

# Unico ponto que o pipeline altera:
#   kustomize edit set image fiapdevopsadegj.azurecr.io/auth-service=:<tag>
# O commit dessa linha e o que dispara o deploy no ArgoCD.
images:
- name: fiapdevopsadegj.azurecr.io/auth-service
  newTag: latest
