apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: togglemaster

  source:
    repoURL: 'https://dev.azure.com/Oh20Tony/FIAP%20-%20TechChallenge/_git/TCF3%20-%20K8S'
    targetRevision: main
    path: overlays/prod/analytics-service

  destination:
    server: 'https://fiaptc3-dns-l25hulwg.hcp.eastus.azmk8s.io:443'
    namespace: toggle-apps

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Substitui o 00-namespaces.yaml: o label vem daqui em vez de um manifesto
    managedNamespaceMetadata:
      labels:
        projeto: togglemaster
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  # O HPA controla spec.replicas. Sem isto o ArgoCD reverteria o
  # autoscaling a cada sync e a Application ficaria sempre OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
